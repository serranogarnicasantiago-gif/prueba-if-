<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba if</title>
</head>
<body>
  <script>
    let continua = confirm("Desea agregar datos?");

    if (continua) {
        let nombre = prompt("Ingresa tu nombre");
        let edad = Number(prompt("Ingresa tu edad"));
        let especialidad = prompt("Ingresa tu especialidad");
        let telefono = prompt("Ingresa tu telefono");
        let correo = prompt("Ingresa tu correo");

        document.write("Tu nombre es: " + nombre + "<br>");
        document.write("Tu edad es: " + edad + "<br>");
        document.write("Tu especialidad es: " + especialidad + "<br>");
        document.write("Tu telefono es: " + telefono + "<br>");
        document.write("Tu correo es: " + correo + "<br>");
    } else {
        document.write("ANCIANO");
    }
  </script>
</body>
</html>
